<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N'FAYE • Assistant Vocal IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');
        :root { --primary: #6366f1; }
        body { font-family: 'Inter', system-ui, sans-serif; }
        .font-display { font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: 600; }
        .futuristic-bg { background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); }
        .neon-glow { box-shadow: 0 0 15px rgba(99,102,241,.3), 0 0 30px rgba(99,102,241,.1); }
        .glass { background: rgba(15,23,42,.75); backdrop-filter: blur(20px); }
        .orb { width:180px; height:180px; background:radial-gradient(circle at 40% 30%,#6366f1,#312e81); box-shadow:0 0 60px rgba(99,102,241,.6),inset 0 0 40px rgba(255,255,255,.15); transition:all .4s cubic-bezier(.4,0,.2,1); }
        .orb.listening { animation:pulse-listen 1.5s infinite ease-in-out; box-shadow:0 0 80px rgba(52,211,153,.7),inset 0 0 40px rgba(255,255,255,.15); }
        .orb.speaking { animation:pulse-speak .8s infinite ease-in-out; box-shadow:0 0 80px rgba(251,191,36,.7),inset 0 0 40px rgba(255,255,255,.15); }
        .orb.thinking { animation:pulse-think 1.2s infinite ease-in-out; box-shadow:0 0 70px rgba(167,139,250,.6),inset 0 0 40px rgba(255,255,255,.15); }
        @keyframes pulse-listen { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
        @keyframes pulse-speak { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }
        @keyframes pulse-think { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .status-text { font-size:.875rem; letter-spacing:.5px; }
        .message { max-width:85%; animation:fadeInUp .3s ease forwards; }
        .section-header { font-size:.75rem; letter-spacing:1px; }
        .modern-shadow { box-shadow:0 25px 50px -12px rgb(0 0 0 / .4); }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 futuristic-bg">
    <div class="max-w-4xl mx-auto min-h-screen p-4 md:p-8">
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-x-3">
                <div class="w-11 h-11 flex items-center justify-center bg-indigo-600 rounded-2xl"><i class="fa-solid fa-robot text-white text-3xl"></i></div>
                <div><h1 class="font-display text-4xl font-semibold tracking-tighter">N'FAYE</h1><p class="text-indigo-400 text-sm -mt-1">Assistant Vocal IA</p></div>
            </div>
            <div class="flex items-center gap-x-2"><div id="api-status" class="px-3 py-1.5 rounded-3xl bg-slate-900 flex items-center gap-x-2 text-sm"><div id="api-status-dot" class="w-2 h-2 bg-amber-400 rounded-full"></div><span id="api-status-label" class="text-amber-400 text-xs font-medium">VÉRIFICATION...</span></div></div>
        </div>
        <div class="glass border border-slate-800 rounded-3xl p-8 modern-shadow">
            <div class="flex flex-col items-center mb-8">
                <div id="orb" class="orb rounded-full flex items-center justify-center cursor-pointer border border-indigo-500/30 mb-4" onclick="toggleListening()"><div class="text-center"><i id="orb-icon" class="fa-solid fa-microphone text-white text-5xl opacity-90"></i></div></div>
                <div id="status" class="px-5 py-1.5 bg-slate-900 rounded-3xl text-sm font-medium flex items-center gap-x-2"><span id="status-text">Prêt à vous écouter</span></div>
            </div>
            <div class="flex justify-center gap-x-3 mb-8">
                <button onclick="toggleListening()" class="px-6 py-3.5 bg-indigo-600 hover:bg-indigo-500 transition-colors text-white font-medium rounded-3xl flex items-center gap-x-2 text-sm"><i class="fa-solid fa-microphone mr-2"></i><span id="mic-btn-text">Activer le microphone</span></button>
                <button onclick="stopAssistant()" class="px-6 py-3.5 bg-slate-800 hover:bg-slate-700 transition-colors text-white font-medium rounded-3xl flex items-center gap-x-2 text-sm border border-slate-700"><i class="fa-solid fa-stop mr-2"></i><span>Arrêter</span></button>
            </div>
            <div class="mb-2 px-1 flex items-center justify-between"><div class="section-header text-slate-400 font-medium">CONVERSATION</div></div>
            <div id="conversation" class="h-[260px] overflow-y-auto bg-slate-900/70 border border-slate-800 rounded-3xl p-5 space-y-4 text-sm"></div>
            <div class="mt-6">
                <div class="section-header text-slate-400 font-medium mb-2 px-1">COMMANDES RAPIDES</div>
                <div class="flex flex-wrap gap-2">
                    <button onclick="quickCommand('Quelle heure est-il ?')" class="px-4 py-2 text-xs bg-slate-800 hover:bg-slate-700 transition-colors rounded-2xl text-slate-300">Quelle heure est-il ?</button>
                    <button onclick="quickCommand('Quel jour sommes-nous ?')" class="px-4 py-2 text-xs bg-slate-800 hover:bg-slate-700 transition-colors rounded-2xl text-slate-300">Quel jour sommes-nous ?</button>
                    <button onclick="quickCommand('Bonjour N\'FAYE')" class="px-4 py-2 text-xs bg-slate-800 hover:bg-slate-700 transition-colors rounded-2xl text-slate-300">Bonjour N'FAYE</button>
                </div>
            </div>
        </div>
        <div class="text-center mt-6"><p class="text-xs text-slate-500">Version 1.1 • IA Groq • Reconnaissance vocale française</p></div>
    </div>

    <script>
        // Remplace cette adresse si Render affiche un autre domaine pour ton service.
        const API_URL = "https://nfaye-api-prod.onrender.com";
        let isListening = false;
        let recognition = null;
        const synth = window.speechSynthesis;
        const conversation = document.getElementById('conversation');
        // Conserve les derniers échanges pour que N'FAYE comprenne le contexte.
        const conversationHistory = [];
        const orb = document.getElementById('orb');
        const statusText = document.getElementById('status-text');
        const micBtnText = document.getElementById('mic-btn-text');
        const orbIcon = document.getElementById('orb-icon');

        async function checkApiStatus() {
            const label = document.getElementById('api-status-label');
            const dot = document.getElementById('api-status-dot');
            try {
                const response = await fetch(API_URL + "/health");
                if (!response.ok) throw new Error("API indisponible");
                const data = await response.json();
                label.textContent = data.api_key_configured ? "IA CONNECTÉE" : "CLÉ GROQ MANQUANTE";
                label.className = data.api_key_configured
                    ? "text-emerald-400 text-xs font-medium"
                    : "text-amber-400 text-xs font-medium";
                dot.className = data.api_key_configured
                    ? "w-2 h-2 bg-emerald-400 rounded-full animate-pulse"
                    : "w-2 h-2 bg-amber-400 rounded-full";
            } catch (error) {
                label.textContent = "SERVEUR INDISPONIBLE";
                label.className = "text-rose-400 text-xs font-medium";
                dot.className = "w-2 h-2 bg-rose-400 rounded-full";
                console.error("Vérification du serveur N'FAYE :", error);
            }
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex ' + (sender === 'user' ? 'justify-end' : 'justify-start');
            const bubble = document.createElement('div');
            bubble.className = 'message px-4 py-3 rounded-3xl max-w-[75%] text-sm ' +
                (sender === 'user' ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-slate-800 text-slate-200 rounded-tl-none');
            const label = document.createElement('div');
            label.className = 'text-[10px] opacity-60 mb-0.5 font-medium';
            label.textContent = sender === 'user' ? 'Vous' : "N'FAYE";
            const content = document.createElement('div');
            content.textContent = String(text ?? '');
            content.style.whiteSpace = 'pre-wrap';
            bubble.append(label, content);
            messageDiv.appendChild(bubble);
            conversation.appendChild(messageDiv);
            conversation.scrollTop = conversation.scrollHeight;
        }

        function setStatus(mode, text) {
            statusText.textContent = text;
            orb.classList.remove('listening', 'speaking', 'thinking');
            if (mode === 'listening') {
                orb.classList.add('listening');
                orbIcon.className = 'fa-solid fa-microphone text-emerald-300 text-5xl';
            } else if (mode === 'speaking') {
                orb.classList.add('speaking');
                orbIcon.className = 'fa-solid fa-volume-up text-amber-300 text-5xl';
            } else if (mode === 'thinking') {
                orb.classList.add('thinking');
                orbIcon.className = 'fa-solid fa-brain text-violet-300 text-5xl';
            } else {
                orbIcon.className = 'fa-solid fa-microphone text-white text-5xl';
            }
        }

        function resetOrb() {
            orb.classList.remove('listening', 'speaking', 'thinking');
            orbIcon.className = 'fa-solid fa-microphone text-white text-5xl';
            statusText.textContent = "Prêt à vous écouter";
            micBtnText.textContent = "Activer le microphone";
        }

        function initSpeechRecognition() {
            const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognitionAPI) {
                alert("La reconnaissance vocale n'est pas disponible dans ce navigateur. Essaie Chrome sur HTTPS.");
                return false;
            }
            recognition = new SpeechRecognitionAPI();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'fr-FR';
            recognition.onresult = async function(event) {
                const transcript = event.results?.[0]?.[0]?.transcript?.trim();
                if (!transcript) return;
                addMessage(transcript, 'user');
                await processCommand(transcript);
            };
            recognition.onerror = function(event) {
                console.error('Erreur de reconnaissance vocale :', event.error);
                setStatus('idle', "Erreur de reconnaissance");
                resetOrb();
            };
            recognition.onend = function() {
                isListening = false;
                if (statusText.textContent === "Écoute en cours...") resetOrb();
            };
            return true;
        }

        function toggleListening() {
            if (!recognition && !initSpeechRecognition()) return;
            if (isListening) {
                recognition.stop();
                isListening = false;
                resetOrb();
                return;
            }
            try {
                recognition.start();
                isListening = true;
                setStatus('listening', "Écoute en cours...");
                micBtnText.textContent = "Arrêter d'écouter";
            } catch (error) {
                console.error('Impossible de démarrer le microphone :', error);
                setStatus('idle', "Autorise le microphone puis réessaie");
            }
        }

        async function processCommand(text) {
            conversationHistory.push({ role: 'user', content: text });
            if (conversationHistory.length > 12) conversationHistory.splice(0, conversationHistory.length - 12);
            setStatus('thinking', "N'FAYE réfléchit...");
            try {
                const response = await fetch(API_URL + "/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text, history: conversationHistory.slice(-12) })
                });
                if (!response.ok) throw new Error("Erreur HTTP " + response.status);
                const data = await response.json();
                if (typeof data.response !== "string" || !data.response.trim()) {
                    throw new Error("Réponse API invalide");
                }
                conversationHistory.push({ role: 'assistant', content: data.response });
                if (conversationHistory.length > 12) conversationHistory.splice(0, conversationHistory.length - 12);
                addMessage(data.response, 'assistant');
                speak(data.response);
            } catch (error) {
                console.error("Erreur de connexion à N'FAYE :", error);
                const message = "Je n'arrive pas à joindre mon serveur. Vérifie que Render a terminé le déploiement et que l'adresse de l'API est correcte.";
                addMessage(message, 'assistant');
                speak(message);
            }
        }

        function quickCommand(command) {
            addMessage(command, 'user');
            processCommand(command);
        }

        function speak(text) {
            if (!synth || !('SpeechSynthesisUtterance' in window)) return;
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.rate = 0.95;
            utterance.pitch = 1.05;
            utterance.volume = 0.9;
            utterance.onstart = () => setStatus('speaking', "N'FAYE parle...");
            utterance.onend = () => resetOrb();
            utterance.onerror = () => resetOrb();
            synth.speak(utterance);
        }

        function stopAssistant() {
            if (recognition && isListening) recognition.stop();
            if (synth) synth.cancel();
            isListening = false;
            resetOrb();
            const note = document.createElement('div');
            note.className = 'flex justify-center mt-4';
            const label = document.createElement('div');
            label.className = 'px-4 py-1.5 text-xs text-slate-400 bg-slate-900 rounded-3xl';
            label.textContent = 'Session terminée';
            note.appendChild(label);
            conversation.appendChild(note);
        }

        function initialize() {
            const welcome = document.createElement('div');
            welcome.className = 'flex justify-center';
            const label = document.createElement('div');
            label.className = 'px-4 py-2 text-xs bg-slate-800 text-slate-400 rounded-3xl text-center';
            label.textContent = "Bonjour ! Dites « Bonjour N'FAYE » pour commencer.";
            welcome.appendChild(label);
            conversation.appendChild(welcome);
        }

        window.addEventListener('DOMContentLoaded', () => { initialize(); checkApiStatus(); });
    </script>
</body>
</html>
